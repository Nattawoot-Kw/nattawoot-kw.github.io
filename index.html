<title>Natto Worlds</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="image" href="assets/pixel/room.webp" fetchpriority="high">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&family=Itim&family=Kanit:wght@400&display=swap">
<style>
/* Layout: one pixel room that never scrolls, dressed like a pastel visual novel: halftone frame, sticker tags, grid-paper menus. */
:root{
  color-scheme:light;
  --ink:#2a2340; --cream:#fff8e6; --grid:#ffe98f; --pink:#ff9fb8; --mint:#7fe3d8; --teal:#22bfbb; --sun:#ffd23f; --coral:#f0563c; --blue:#1a5fe0; --a:#22bfbb;
  --f-pixel:"Pixelify Sans","Itim",sans-serif; --f-tiny:"VT323","Itim",monospace; --f-ui:"Itim","Kanit",system-ui,sans-serif;
}
[data-world="about"]{--a:#1a5fe0}
[data-world="unity"]{--a:#17a58f}
[data-world="punk"]{--a:#e0348c}
[data-world="ape"]{--a:#d98a00}
[data-world="fn"]{--a:#1a5fe0}
[data-world="peng"]{--a:#17a58f}
[data-world="ai"]{--a:#f0563c}
[data-world="mail"]{--a:#e0348c}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ink); color:var(--ink); font:400 15px/1.45 var(--f-ui); overflow:hidden; display:grid; place-items:center}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
img,video{display:block; max-width:100%}
h1,h2,h3,p,ul,ol,figure{margin:0; padding:0}
ul,ol{list-style:none}
:focus-visible{outline:3px solid var(--blue); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}

/* ---------- room ---------- */
.screen{position:relative; width:min(100vw,calc(100dvh*1376/768)); aspect-ratio:1376/768; max-width:100%; container-type:inline-size}
.stage{position:absolute; inset:0; overflow:hidden; container-type:inline-size; background:var(--ink)}
.room{width:100%; height:100%; image-rendering:pixelated}
#things{position:absolute; inset:0; z-index:3; pointer-events:none}
#things .thing{pointer-events:auto}
.cam{position:absolute; inset:0; transform-origin:0 0; transition:transform .55s cubic-bezier(.3,.8,.3,1)}
.frame{position:absolute; inset:0; z-index:4; pointer-events:none; border:.9cqw solid; border-image:linear-gradient(120deg,var(--sun),var(--pink) 45%,var(--sun) 70%,var(--mint)) 1}
.dots{position:absolute; inset:0; pointer-events:none;
  background:var(--ht-tl) 0 0/15cqw 15cqw no-repeat,var(--ht-tr) 100% 0/15cqw 15cqw no-repeat,var(--ht-bl) 0 100%/15cqw 15cqw no-repeat,var(--ht-br) 100% 100%/15cqw 15cqw no-repeat}
.thing{position:absolute; left:calc(var(--x)/1280*100%); bottom:calc((1 - var(--y)/714.4)*100%); width:calc(var(--w)/1280*100%); transform:translateX(-50%); z-index:calc(var(--z,1))}
.thing:hover,.thing:focus-visible,.thing.on{z-index:6}
.thing .art{display:block; width:100%; height:auto; image-rendering:pixelated; transform-origin:50% 100%}
.thing:hover .body,.thing:focus-visible .body,.thing.on .body{animation:hop .42s steps(1) 1; filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff)}
@keyframes hop{0%{transform:none}25%{transform:scale(1.08,.88)}55%{transform:scale(.95,1.1) translateY(-9%)}80%{transform:scale(1.03,.97)}100%{transform:none}}
.tag{position:absolute; left:50%; bottom:calc(100% + .6cqw); transform:translateX(-50%) rotate(-2deg); background:var(--coral); color:#fff; border:3px solid #fff; box-shadow:0 3px 0 var(--ink); border-radius:9px; font:400 max(16px,1.5cqw)/1.1 var(--f-tiny); padding:.3em .7em; white-space:nowrap; opacity:0; pointer-events:none}
.tag small{display:block; font:400 max(11px,.9cqw)/1.2 var(--f-ui)}
.thing:hover .tag,.thing:focus-visible .tag,.thing.on .tag{opacity:1}
.cam.zoom .thing.on .tag{opacity:0}
.thing.edge-r .tag{left:auto; right:0; transform:rotate(-2deg)}
.thing.edge-l .tag{left:0; transform:rotate(-2deg)}
.screen-ai{position:absolute; left:14%; right:14%; top:11%; height:53%; display:grid; place-items:center; font:700 max(14px,2.3cqw)/1 var(--f-pixel); color:var(--mint); opacity:0}
.thing:hover .screen-ai,.thing:focus-visible .screen-ai,.thing.on .screen-ai{opacity:1}
.hero{--z:3}
.thing[data-id="peng"]{--z:3}
.doll{position:absolute; left:calc(var(--x)/1280*100%); bottom:calc((1 - var(--y)/714.4)*100%); width:calc(var(--w)/1280*100%); height:auto; translate:-50% 0; z-index:2; pointer-events:none; image-rendering:pixelated}
.bag{position:absolute; left:73.765%; top:58.854%; width:9.884%; height:auto; z-index:2; pointer-events:none; image-rendering:pixelated}
/* seat objects in the room: floor shadows, room-matched light, mailbox mounted on the wall without its post */
.thing[data-id="fn"]::before,.thing[data-id="about"]::before,.thing[data-id="mail"]::before{content:""; position:absolute; left:-10%; right:-10%; bottom:-4%; height:11%; z-index:-1; pointer-events:none; background:radial-gradient(closest-side,#07071ad9 55%,#07071a00)}
.thing[data-id="mail"] .art{filter:brightness(.82) saturate(.9)}
.thing:focus{outline:none}
.body{position:relative; display:block; transform-origin:50% 100%}
.hero .frames{position:relative}
.lids{position:absolute; inset:0; pointer-events:none}
.hero .lids{animation:headbob 1.4s steps(1) infinite}
@keyframes headbob{0%{transform:none}25%{transform:translateY(.53%)}50%{transform:translateY(1.06%)}75%{transform:translateY(.53%)}}
.lid{position:absolute; left:var(--l); top:var(--t); width:var(--w); height:var(--h); background:var(--lid); border-bottom:max(1px,.17cqw) solid var(--ink); opacity:0; animation:wink var(--blink,3.7s) steps(1) infinite}
@keyframes wink{0%,90%,95%,100%{opacity:0}91%,94%{opacity:1}}
.thing[data-id="peng"]{--lid:#d7e8f8; --blink:3.3s; --fidget:waddle; --beat:1.2s}
.thing[data-id="ape"]{--lid:#eaa181; --blink:4.3s; --fidget:sway; --beat:1.4s}
.thing[data-id="about"]{--lid:#fbdcc8; --blink:3.9s; --fidget:bob; --beat:1.4s}
.thing[data-id="unity"]{--fidget:float; --beat:1.4s}
.thing[data-id="punk"]{--fidget:swing; --beat:1.4s}
.thing[data-id="punk"] .body{transform-origin:50% 0}
.thing[data-id="about"] .lid{border-radius:0 0 50% 50%/0 0 70% 70%}
.thing[data-id="fn"]{--fidget:rattle; --beat:.7s}
.thing[data-id="mail"]{--fidget:wobble; --beat:1.4s}
/* when the camera lands, each object fidgets in its own way */
.cam.zoom .thing.on .body{animation:hop .42s steps(1) 1,var(--fidget,bob) var(--beat,1.4s) steps(1) .42s infinite}
@keyframes bob{0%{transform:none}25%{transform:scale(1.015,.975)}50%{transform:scale(1.03,.95)}75%{transform:scale(1.015,.975)}}
@keyframes waddle{0%{transform:rotate(-5deg) scale(1.02,.97)}25%{transform:translateY(-4%)}50%{transform:rotate(5deg) scale(1.02,.97)}75%{transform:translateY(-4%)}}
@keyframes sway{0%{transform:rotate(-3deg) scale(1.02,.97)}25%{transform:none}50%{transform:rotate(3deg) scale(1.02,.97)}75%{transform:none}}
@keyframes float{0%{transform:none}25%{transform:translateY(-3%)}50%{transform:translateY(-6%)}75%{transform:translateY(-3%)}}
@keyframes swing{0%{transform:rotate(-2deg)}25%{transform:none}50%{transform:rotate(2deg)}75%{transform:none}}
@keyframes rattle{0%{transform:none}25%{transform:translateX(-.8%)}50%{transform:none}75%{transform:translateX(.8%)}}
@keyframes wobble{0%{transform:rotate(-3deg)}25%{transform:none}50%{transform:rotate(3deg)}75%{transform:none}}
.hero .frames{display:block; overflow:hidden}
.hero .frames img{width:400%; height:auto; max-width:none; image-rendering:pixelated; animation:idle 1.4s steps(4) infinite}
@keyframes idle{to{transform:translateX(-100%)}}

/* living room: neon breath, city lights, the lamp switch and the sign that must not be touched */
.fx{position:absolute; inset:0; z-index:2; pointer-events:none}
.crop{position:absolute; background-image:url(assets/pixel/room.webp); background-repeat:no-repeat; image-rendering:pixelated}
.neon{mix-blend-mode:screen; animation:neon 5s ease-in-out infinite}
.halo{position:absolute; left:32%; top:12%; width:20%; height:24%; background:radial-gradient(closest-side,#ff5fd0a6,#ff5fd000); mix-blend-mode:screen; animation:neon 5s ease-in-out infinite}
@keyframes neon{0%,100%{opacity:.25}45%{opacity:1}50%{opacity:.55}54%{opacity:1}}
.tw{position:absolute; animation:tw var(--d) steps(1) var(--o) infinite}
.star{width:.22%; height:.4%; background:#fff; animation-name:star; animation-timing-function:ease-in-out}
@keyframes tw{0%,100%{opacity:1}60%{opacity:.1}}
@keyframes star{0%,100%{opacity:.15}50%{opacity:1}}
/* the floor lamp's light on the wall: soft-edged and slowly swaying, it breathes in opacity to draw the eye to the switch */
.lampfx{position:absolute; inset:0; z-index:2; pointer-events:none; mix-blend-mode:screen; filter:blur(.7cqw); transform-origin:7.4% 52.5%; animation:lampsway 6s ease-in-out infinite}
.lampfx i{position:absolute; inset:0; clip-path:var(--c); background:radial-gradient(ellipse 24% 42% at 7.4% 52.5%,#ffc76ee0,#ff9d3c70 55%,#ff9d3c00); opacity:.45; animation:lampbreathe 4.4s ease-in-out infinite}
.l-up{--c:polygon(0 30.6%,12% 31.4%,6.8% 47.6%,0 48.2%)}
.l-dn{--c:polygon(5.2% 58.2%,8.6% 58.8%,1.6% 82%,0 84%,0 65%)}
@keyframes lampsway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg) scale(1.02)}}
@keyframes lampbreathe{0%,100%{opacity:.25}50%{opacity:.65}}
.cam.off .lampfx{display:none}
.dark-room{position:absolute; inset:0; z-index:4; background:#02030f; opacity:0; pointer-events:none; --m:radial-gradient(ellipse 10% 11% at 42.2% 24%,#0000 62%,#000); -webkit-mask:var(--m); mask:var(--m)}
.cam.off .dark-room{opacity:.96}
/* in the dark the NATTO sign shorts out: the tube stutters, pixel bolts arc off it and sparks rain down */
.cam.off .neon,.cam.off .halo{animation:shortout 2.3s steps(1) infinite}
@keyframes shortout{0%,100%{opacity:1}6%{opacity:.25}8%{opacity:1}12%{opacity:.1}14%{opacity:.9}37%{opacity:1}39%{opacity:0}42%{opacity:1}44%{opacity:.15}46%{opacity:1}69%{opacity:.4}71%{opacity:1}86%{opacity:0}89%{opacity:.85}91%{opacity:.1}94%{opacity:1}}
.sparks{display:none; position:absolute; inset:0; z-index:5; pointer-events:none}
.cam.off .sparks{display:block}
.sparks i{position:absolute; width:max(3px,.5cqw); aspect-ratio:1; background:var(--c); opacity:0; animation:spark var(--d) steps(6) var(--o) infinite}
@keyframes spark{0%,42%{opacity:0; transform:none}44%{opacity:1; transform:none}100%{opacity:0; transform:translate(var(--dx),var(--dy))}}
.sparks b{position:absolute; left:var(--l); top:var(--t); width:var(--w); height:var(--h); background:#fff; rotate:var(--r); filter:drop-shadow(0 0 .25cqw #ff5fd0); opacity:0; clip-path:polygon(42% 0,70% 0,56% 34%,92% 34%,30% 100%,44% 54%,10% 54%); animation:arc 2.3s steps(1) var(--o) infinite}
@keyframes arc{0%,100%{opacity:0}12%,13%{opacity:1}14%{opacity:0}39%,41%{opacity:1}42%{opacity:0}86%,88%{opacity:1}89%{opacity:0}}
/* in the dark a note stays by the lamp until the visitor switches it back on */
.lamp-hint{display:none; position:absolute; z-index:5; left:1.8%; bottom:55%; max-width:27%; padding:.45em .75em; background:var(--sun); color:var(--ink); border:2px solid #fff; border-radius:8px; font:400 max(12px,1.35cqw)/1.25 var(--f-ui); pointer-events:none; animation:hintglow 2.4s ease-in-out infinite}
.lamp-hint::after{content:""; position:absolute; left:22%; top:100%; border-inline:7px solid #0000; border-top:9px solid var(--sun)}
.cam.off .lamp-hint{display:block}
@keyframes hintglow{0%,100%{opacity:1; box-shadow:0 0 0 0 #ffd23f00}50%{opacity:.82; box-shadow:0 0 1.6cqw .2cqw #ffd23f99}}
#lamp:focus-visible{outline:none}
.hot{position:absolute; z-index:6; padding:0; background:none; border:0; cursor:pointer}
.tears{display:none; position:absolute; inset:0; pointer-events:none}
.tears i{position:absolute; top:46%; width:5%; height:5%; background:#7fd4ff; box-shadow:0 0 0 1px #1a5fe0; animation:tear .9s steps(5) infinite}
.tears i:first-child{left:27%}
.tears i:last-child{left:68%; animation-delay:.35s}
@keyframes tear{from{transform:none; opacity:1}to{transform:translateY(320%); opacity:0}}
.hero.cry .tears{display:block}
/* moods: hand-drawn eyes and mouth over the sprite, which itself never changes */
.hero .lids::after,.vn-face::after,.hud .face::after{content:""; position:absolute; inset:0; image-rendering:pixelated; background:var(--mood,none) 0 0/100% 100% no-repeat; display:none}
:root[data-mood] .hero .lids::after,:root[data-mood] .vn-face::after,:root[data-mood] .hud .face::after{display:block}
:root[data-mood] .hero .lid{display:none}
:root[data-mood=joy]{--mood:url(assets/pixel/face-joy.png)}
:root[data-mood=cry]{--mood:url(assets/pixel/face-cry.png)}
:root[data-mood=shock]{--mood:url(assets/pixel/face-shock.png)}
:root[data-mood=scared]{--mood:url(assets/pixel/face-scared.png)}
:root[data-mood=scared] .hero .body{animation:rattle .24s steps(2) infinite}
/* eyes that watch the pointer, in layers: the sprite's eye with a clean white, then its iris sliding inside a mask of the eye opening, so it passes behind the lid */
.eyes{position:absolute; inset:0; pointer-events:none}
.vn-face .eyes{inset:auto; left:0; top:0; width:calc(178%*214/377); height:178%}
.eye{position:absolute; top:37.93%; height:7.16%; background:var(--w) 0 0/100% 100% no-repeat; image-rendering:pixelated}
.eye u{position:absolute; inset:0; -webkit-mask:var(--m) 0 0/100% 100% no-repeat; mask:var(--m) 0 0/100% 100% no-repeat}
.eye b{position:absolute; inset:0; background:var(--i) 0 0/100% 100% no-repeat; image-rendering:pixelated; transform:translate(calc(var(--ex,0)*var(--sx)),calc(var(--ey,0)*3.7%)); transition:transform .1s linear}
.eye.l{left:23.36%; width:19.63%; --sx:7.14%; --w:url(assets/pixel/eye-l.png); --i:url(assets/pixel/iris-l.png); --m:url(assets/pixel/mask-l.png)}
.eye.r{left:57.94%; width:20.56%; --sx:6.82%; --w:url(assets/pixel/eye-r.png); --i:url(assets/pixel/iris-r.png); --m:url(assets/pixel/mask-r.png)}
:root[data-mood] .eyes{display:none}
:root[data-mood=shock] .hero .body{animation:rattle .12s steps(2) infinite}
.snd.re{background:var(--ink); opacity:.75}
.snd.re svg{display:block; width:62%; height:62%; margin:auto}
#askRe{flex:none; width:34px; background:var(--ink); padding:0; display:grid; place-items:center; clip-path:none}
#askRe svg{width:18px; height:18px}
.vn-face::after{background-size:auto 178%}
.hud .face{position:relative}
.hud .face::after{background-size:auto 180%}
.hero.joy .body{animation:joy .5s steps(2) infinite}
@keyframes joy{50%{transform:translateY(-7%)}}
.ask{position:absolute; z-index:7; right:calc(50% + 8.5cqw); top:29%; width:min(44%,300px); display:grid; gap:8px; padding:10px 12px; background:#fff; color:var(--ink); border:3px solid var(--ink); box-shadow:0 4px 0 #2a234099; font-size:max(13px,1.25cqw); line-height:1.35}
.ask::after{content:""; position:absolute; left:100%; top:34%; border-block:7px solid #0000; border-left:11px solid var(--ink)}
.ask div{display:flex; gap:8px}
.ask button{flex:1; padding:5px 0 7px; color:#fff; font:400 max(15px,1.4cqw)/1 var(--f-tiny); clip-path:polygon(0 8%,100% 0,96% 100%,4% 100%)}
#askYes{background:var(--teal); box-shadow:inset 0 -3px 0 var(--sun)}
#askNo{background:var(--coral); box-shadow:inset 0 -3px 0 var(--ink)}
.boom{position:absolute; inset:0; z-index:9; display:grid; place-content:center; justify-items:center; gap:6px; overflow:hidden; background:#fff; animation:flash .5s steps(4) forwards; color:#fff; text-align:center}
@keyframes flash{to{background:#0a0614}}
.boom b{position:absolute; left:42.5%; top:24%; width:var(--s); height:var(--s); background:var(--c); animation:fly 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(200deg); opacity:0}}
.boom h2{font:700 max(38px,7cqw)/1 var(--f-pixel); color:var(--coral); text-shadow:3px 3px 0 #fff; opacity:0; animation:over .3s .7s steps(3) forwards}
.boom p{font:400 max(16px,1.5cqw)/1 var(--f-tiny); opacity:0; animation:over .3s 2.9s steps(3) forwards}
.boom .tease{max-width:88%; font:400 max(15px,2cqw)/1.35 var(--f-ui); color:var(--sun); animation-delay:1.1s}
@keyframes over{to{opacity:1}}
.stage.shake{animation:shake .5s steps(8)}
@keyframes shake{20%{transform:translate(-1.2%,.8%)}40%{transform:translate(1.2%,-.9%)}60%{transform:translate(-.8%,-.6%)}80%{transform:translate(.8%,.6%)}}
/* ---------- HUD, menu, dialogue ---------- */
.topbar{position:absolute; z-index:6; left:2.2%; right:2.4%; top:2.6%; display:flex; align-items:center; gap:1.2cqw; transition:left .22s steps(6),right .22s steps(6)}
.hud{flex:none; display:flex; align-items:center; gap:.5em; font:400 max(17px,1.6cqw)/1 var(--f-tiny); color:#fff; pointer-events:none}
.hud .face{width:4.6cqw; height:4.6cqw; min-width:34px; min-height:34px; border-radius:50%; border:3px solid #fff; background:var(--cream) url(assets/pixel/hero.webp) 0 0/auto 180% no-repeat; image-rendering:pixelated; overflow:hidden}
.hud span{background:var(--blue); border:2px solid #fff; border-radius:99px; padding:.35em .7em}
.snd{pointer-events:auto; flex:none; width:3.2cqw; height:3.2cqw; min-width:30px; min-height:30px; padding:0; border-radius:50%; background:var(--coral); color:#fff; border:2px solid #fff; font:400 max(17px,1.6cqw)/1 var(--f-ui)}
.snd[aria-pressed="false"]{background:var(--ink); color:#fff; text-decoration:line-through}
.roster{flex:1; min-width:0; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:.45cqw}
.roster button{position:relative; background:var(--teal); color:#fff; font:400 max(16px,1.55cqw)/1 var(--f-tiny); padding:.62em .1em .72em; white-space:nowrap; clip-path:polygon(0 8%,100% 0,97% 100%,3% 100%); box-shadow:inset 0 -4px 0 var(--pink); text-shadow:1px 1px 0 #0d6e6c}
.roster button:hover,.roster button.on{background:var(--blue); box-shadow:inset 0 -4px 0 var(--sun); text-shadow:none}
.say{position:absolute; z-index:4; left:50%; bottom:2.2%; transform:translateX(-50%); width:62%; min-height:7cqw; padding:.7cqw 3cqw .7cqw 11.4cqw; display:flex; align-items:center;
  border:3px solid #fff; box-shadow:0 0 0 3px var(--ink); font-size:max(14px,1.5cqw); line-height:1.4;
  background:radial-gradient(circle,#ffffffb0 22%,#0000 25%) 0 0/1.05cqw 1.05cqw,linear-gradient(100deg,#ffc2d1,#ffe5ad 55%,#b5f0e8); transition:left .22s steps(6)}
.vn-face{position:absolute; left:.6cqw; bottom:0; width:9.6cqw; height:9.6cqw; background:url(assets/pixel/hero.webp) 0 0/auto 178% no-repeat; image-rendering:pixelated; animation:none; filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 -2px 0 #fff); pointer-events:none}
.vn-name{position:absolute; right:calc(100% - 10px); bottom:-4px; transform:rotate(-3deg); background:var(--coral); color:#fff; border:2px solid #fff; border-radius:7px; font:400 max(16px,1.5cqw)/1 var(--f-tiny); padding:.25em .55em}
.vn-next{position:absolute; right:1cqw; bottom:.7cqw; border-top:.9cqw solid var(--ink); border-inline:.75cqw solid #0000; animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.screen[data-side] .hud{display:none}
.screen[data-side="left"] .say{left:auto; right:1.5%; transform:none; width:calc(100% - max(43.2%,412px) - 3%)}
.screen[data-side="left"] .topbar{left:max(45%,420px)}

/* ---------- menus: grid paper ---------- */

.lede{font-size:.95rem; line-height:1.4; flex:none}

.work{position:relative; overflow:hidden; background:var(--ink); text-align:left; min-height:0; filter:drop-shadow(0 3px 0 #2a234066)}
/* pixel frame per world: nine-slice, so corners keep their art at any tile shape */
.work::after{content:""; position:absolute; inset:0; pointer-events:none; border:clamp(16px,5.2cqmin,24px) solid; border-image:var(--frame) var(--cut); image-rendering:pixelated}
[data-world="about"]{--frame:url(assets/frames/about.webp); --cut:68}

.work span{position:absolute; z-index:1; left:50%; bottom:2px; translate:-50% 0; max-width:calc(100% - 28px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#fff; font-size:.8rem; line-height:1.3; padding:1px 3px; text-shadow:-1.5px 0 0 #000,1.5px 0 0 #000,0 -1.5px 0 #000,0 1.5px 0 #000,-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000,1.5px 1.5px 0 #000}

function blip(){
  if(muted||!audio||audio.state!=='running') return;
  const t=audio.currentTime, o=audio.createOscillator(), g=audio.createGain();
  o.type='triangle'; o.frequency.value=[523,587,659][Math.random()*3|0];
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.014,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t+.055);
}

function sfx(name){
  if(muted||!audio||audio.state==='closed') return;
  let t=audio.currentTime+.005;
  SFX[name].forEach(([f,d])=>{
    const o=audio.createOscillator(), g=audio.createGain();
    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(name==='hover'?.008:name==='lamp'?.07:.016,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+d+.01); t+=d*.8;
  });
}

function dots(color,cx,cy){
  const n=240, s=12, k=document.createElement('canvas'), g=k.getContext('2d'); k.width=k.height=n; g.fillStyle=color;
  for(let y=0,row=0;y<=n;y+=s*.86,row++) for(let x=row%2?s/2:0;x<=n;x+=s){
    const r=8.5*(1-Math.hypot(x-cx*n,y-cy*n)/(n*.95));
    if(r>.5){ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  }
  return `url(${k.toDataURL()})`;
}

  view.hidden=false;
  view.querySelector('#vPrev').onclick=()=>show(vList,(vI-1+vList.length)%vList.length);
  view.querySelector('#vNext').onclick=()=>show(vList,(vI+1)%vList.length);
  view.querySelector('#vClose').onclick=closeView;

}
function closeView(){ sfx('back'); view.hidden=true; view.innerHTML=''; loops(true); if(!muted&&audio) bgm.play().catch(()=>{}); if(vBack&&vBack.isConnected) vBack.focus(); }

/* wire each tool to its spot on the figure, measured so the lines land on the body at any size */
function wire(){
  const m=document.querySelector('.cmap'); if(!m) return;
  const f=m.querySelector('.fig'); if(!f.complete||!f.naturalWidth){ f.onload=wire; return; }
  const r=m.getBoundingClientRect(), b=f.getBoundingClientRect(), k=Math.min(b.width/f.naturalWidth,b.height/f.naturalHeight);
  const w=f.naturalWidth*k, h=f.naturalHeight*k, x0=b.left+(b.width-w)/2, y0=b.top+(b.height-h)/2;
  m.querySelectorAll('.pt').forEach(e=>e.remove());
  m.querySelector('svg').innerHTML=[...m.querySelectorAll('.st')].map(s=>{
    const t=TOOLS[+s.dataset.i], q=s.getBoundingClientRect(), left=t[3]==='l';
    const px=(x0+w*t[5]-r.left)/r.width*100, py=(y0+h*t[6]-r.top)/r.height*100, y=(q.bottom-1-r.top)/r.height*100, x=((left?q.right:q.left)-r.left)/r.width*100;
    m.insertAdjacentHTML('beforeend',`<i class="pt" style="left:${px}%;top:${py}%"></i>`);
    return `<polyline points="${x},${y} ${x+(px-x)*.3},${y} ${px},${py}"/>`;
  }).join('');
}

function drawRadar(){
  const NS="http://www.w3.org/2000/svg", box=document.getElementById('radar'), svg=box.querySelector('svg'), tip=box.querySelector('.tip');
  const CX=220,CY=170,R=104,MAX=100;
  const at=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/SKILLS.length,r=R*v/MAX;return[CX+r*Math.cos(a),CY+r*Math.sin(a)];};
  const add=(tag,attrs,text)=>{const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);if(text!=null)el.textContent=text;svg.appendChild(el);return el;};
  const poly=f=>SKILLS.map((s,i)=>at(i,f(s)).map(n=>n.toFixed(1)).join(',')).join(' ');
  [25,50,75,100].forEach(v=>add('polygon',{class:'ring',points:poly(()=>v)}));
  SKILLS.forEach((_,i)=>{const[x,y]=at(i,MAX);add('line',{class:'ring',x1:CX,y1:CY,x2:x,y2:y});});
  add('polygon',{class:'area',points:poly(s=>LEVEL[s.level])});
  SKILLS.forEach((s,i)=>{
    const[px,py]=at(i,LEVEL[s.level]),[lx,ly]=at(i,MAX+13);
    const mid=Math.abs(lx-CX)<1, anchor=mid?'middle':lx>CX?'start':'end', dy=mid?(ly<CY?-16:6):-6;
    add('text',{x:lx,y:ly+dy,'text-anchor':anchor},s.name);
    add('text',{class:'v',x:lx,y:ly+dy+18,'text-anchor':anchor},s.level);
    add('circle',{class:'dot',cx:px,cy:py,r:5});
    const hit=add('circle',{class:'hit',cx:px,cy:py,r:18,tabindex:0,'aria-label':`${s.name} ระดับ ${s.level} ${s.note}`});
    const showTip=()=>{tip.textContent=s.note;tip.hidden=false;const b=box.getBoundingClientRect(),h=hit.getBoundingClientRect();
      const x=Math.min(Math.max(6,h.left-b.left+h.width/2-tip.offsetWidth/2),b.width-tip.offsetWidth-6);
      tip.style.transform=`translate(${x}px,${h.top-b.top-tip.offsetHeight-2}px)`;};
    const hide=()=>{tip.hidden=true;};
    hit.addEventListener('pointerenter',showTip);hit.addEventListener('pointerleave',hide);
    hit.addEventListener('focus',showTip);hit.addEventListener('blur',hide);hit.addEventListener('click',showTip);
  });
  box.querySelector('tbody').innerHTML=SKILLS.map(s=>`<tr><th scope="row">${s.name}</th><td>${s.level}</td><td>${s.note}</td></tr>`).join('');
}

function jingle(name){
  if(muted||!audio) return;
  bgm.pause(); clearTimeout(tuneEnd);
  const [wave,notes]=TUNE[name]; let t=audio.currentTime+.02;
  notes.forEach(([f,d])=>[[wave,f,.035],['triangle',f/2,.05]].forEach(([w,hz,v])=>{
    const o=audio.createOscillator(), g=audio.createGain();
    o.type=w; o.frequency.value=hz; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d*.95);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+d);
  }) || (t+=d));
  tuneEnd=setTimeout(()=>{ if(!muted&&!document.hidden) bgm.play().catch(()=>{}); },(t-audio.currentTime)*1000+400);

  noise(); stage.classList.add('shake'); setTimeout(()=>jingle('over'),750);

  b.innerHTML=Array.from({length:56},()=>`<b style="--s:${rnd(.6,2.2)}cqw;--c:${['#ff5fd0','#ffd23f','#f0563c','#7fe3d8','#fff'][Math.random()*5|0]};--x:${rnd(-70,70)}cqw;--y:${rnd(-30,50)}cqw"></b>`).join('')+`<h2>GAME OVER</h2><p class="tease">${TEASE[tease++%TEASE.length]}</p><p>RESTARTING...</p>`;
  stage.appendChild(b); sayLive.textContent=b.querySelector('.tease').textContent;
  setTimeout(()=>{ b.remove(); stage.classList.remove('shake'); blown=false; restart(); },4600);
}
document.getElementById('sign').onclick=()=>{
  if(blown) return; blown=true;
  close(); if(!view.hidden) closeView();
  askBox&&askBox.remove(); askBox=null;
  setMood('shock'); bgm.pause(); whistle(); say.textContent='เฮ้ย!! อย่ากดตรงนั้น!';
  setTimeout(explode,700);
};

const start=location.hash.slice(1);
if(byId[start]) open(start,true);
</script>
